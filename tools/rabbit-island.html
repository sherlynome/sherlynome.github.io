/* ================= 地形 ================= */
function jaggedCylinder(rTop, rBottom, h, seg, amp, mat){
  const geo = new THREE.CylinderGeometry(rTop, rBottom, h, seg, 1);
  const pos = geo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const y = pos.getY(i);
    if (Math.abs(Math.abs(y) - h/2) < 0.01){
      const x=pos.getX(i), z=pos.getZ(i);
      const a = Math.atan2(z, x);
      const r = Math.hypot(x,z) * (1 + Math.sin(a*3.7)*amp + Math.sin(a*8.1)*amp*0.5);
      pos.setX(i, Math.cos(a)*r); pos.setZ(i, Math.sin(a)*r);
    }
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat); m.position.y = h/2; return m;
}

const sandMat  = flat(SEASONS.spring.sand);

{

/* ================= 炊烟 ================= */
const smokes = [];
{
  for (let i=0;i<5;i++){
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.12,0.2),0),
      new THREE.MeshLambertMaterial({color:0xdddddd, transparent:true, opacity:0.5, flatShading:true}));
    m.userData = {t: i/5, wp:new THREE.Vector3(1.0, 3.8, -0.6)};
    smokes.push(m);
    house.add(m);
  }
}
function updateSmoke(dt){
  smokes.forEach(s=>{
    s.userData.t += dt*0.25;
    if (s.userData.t > 1) s.userData.t = 0;
    const t = s.userData.t;
    s.position.set(
      s.userData.wp.x + Math.sin(t*6)*0.15*t,
      s.userData.wp.y + t*1.8,
      s.userData.wp.z + Math.cos(t*5)*0.1*t
    );
    s.scale.setScalar(1 + t*2.2);
    s.material.opacity = 0.5*(1-t);
  });
}

}

/* 兔叽 AI 状态机 */
const bunnySpots = [
  [-1,-2],[0.2,-0.8],[-4,0],[2,-3],[-2,3],[5,-1],[-0.5,1],[3.5,4.5],[-5,2.5]
].map(([x,z]) => new THREE.Vector3(x, GROUND_Y, z));
const bunnyState = {
  mode:'rest', timer:2.5, target:bunnySpots[0].clone(),
  hopPhase:0, speed:1.6, isInside:false, goingEat:false, at:0
};
function faceToward(dest, dt, turnSpeed){
  const to = dest.clone().sub(bunny.position); to.y = 0;
  const targetRot = Math.atan2(to.x, to.z);
  let dr = targetRot - bunny.rotation.y;
  while (dr > Math.PI) dr -= Math.PI*2;
  while (dr < -Math.PI) dr += Math.PI*2;
  bunny.rotation.y += dr * Math.min(1, dt*turnSpeed);
}
function hopToward(S, dt, dest, arriveDist){
  const toTarget = dest.clone().sub(bunny.position); toTarget.y = 0;
  if (toTarget.length() < arriveDist) return true;
  toTarget.normalize();
  faceToward(dest, dt, 8);
  bunny.position.add(toTarget.multiplyScalar(S.speed*dt));
  S.hopPhase += dt*7;
  bunny.position.y = GROUND_Y + Math.abs(Math.sin(S.hopPhase))*0.28;
  bunnyEars.forEach(e=> e.rotation.x = Math.sin(S.hopPhase)*0.25 - 0.06);
  return false;
}
function walkToward(S, dt, dest, arriveDist){
  const toTarget = dest.clone().sub(bunny.position); toTarget.y = 0;
  if (toTarget.length() < arriveDist) return true;
  toTarget.normalize();
  faceToward(dest, dt, 10);
  bunny.position.add(toTarget.multiplyScalar(S.speed*0.55*dt));
  S.hopPhase += dt*10;
  bunny.position.y = dest.y + Math.abs(Math.sin(S.hopPhase))*0.05;
  return false;
}
function updateBunny(dt, t, nightF){
  const S = bunnyState;
  if (dt === 0) return;
  if (nightF > 0.5 && !S.isInside && ['rest','hop','eat'].includes(S.mode)) S.mode = 'goHome';
  if (nightF < 0.15 && S.isInside && S.mode === 'sleep') S.mode = 'doorOpenOut';

  switch(S.mode){
    case 'rest':
      bunny.rotation.x = lerp(bunny.rotation.x, 0, dt*5);
      bunny.scale.y = lerp(bunny.scale.y, 0.92, dt*5);
      bunny.position.y = lerp(bunny.position.y, GROUND_Y, dt*5);
      bunnyEars.forEach((e,i)=> e.rotation.x = (Math.sin(t*0.7)>0.92) ? Math.sin(t*8+i)*0.1 - 0.06 : lerp(e.rotation.x,-0.06,dt*5));
      S.timer -= dt;
      if (S.timer <= 0 && nightF < 0.4){
        if (Math.random() < 0.3){ S.target = carrotSpot.clone(); S.goingEat = true; }
        else {
          S.target = bunnySpots[Math.floor(Math.random()*bunnySpots.length)].clone();
          S.goingEat = false;
        }
        S.mode = 'hop';
      }
      break;
    case 'hop':
      if (hopToward(S, dt, S.target, 0.25)){
        if (S.goingEat){ S.mode = 'eat'; S.timer = rand(3, 6); }
        else { S.mode = 'rest'; S.timer = rand(2, 6); }
      }
      break;
    case 'eat':
      bunny.rotation.x = lerp(bunny.rotation.x, 0.28, dt*4);
      bunny.scale.y = lerp(bunny.scale.y, 0.95, dt*5);
      bunnyEars.forEach((e,i)=> e.rotation.x = Math.sin(t*9+i)*0.15 - 0.06);
      S.timer -= dt;
      if (S.timer <= 0){ bunny.rotation.x = 0; S.mode = 'rest'; S.timer = rand(1, 4); }
      break;
    case 'goHome':
      if (hopToward(S, dt, homeSpotOut, 0.32)){ S.mode = 'doorOpenIn'; S.at = 0; }
      break;
    case 'doorOpenIn':
      doorOpenT = 1;
      S.at += dt;
      if (S.at > 0.7){ S.mode = 'walkIn'; }
      break;
    case 'walkIn':
      doorOpenT = 1;
      if (walkToward(S, dt, homeSpotIn, 0.12)){
        bunny.visible = false;
        S.isInside = true;
        doorOpenT = 0;
        S.mode = 'sleep';
      }
      break;
    case 'sleep':
      break;
    case 'doorOpenOut':
      doorOpenT = 1;
      S.at += dt;
      if (S.at > 0.7){
        bunny.visible = true;
        bunny.position.copy(homeSpotIn);
        S.mode = 'walkOut';
      }
      break;
    case 'walkOut':
      doorOpenT = 1;
      if (walkToward(S, dt, homeSpotOut, 0.15)){
        S.isInside = false;
        doorOpenT = 0;
        S.mode = 'rest'; S.timer = rand(1, 3);
      }
      break;
  }
}
bunny.position.copy(homeSpotOut);

      u.timer = rand(2, 5);
      u.speed = rand(0.3, 0.7) * (Math.random()<0.5?1:-1);
      u.dir += rand(-1, 1);

    c.position.x += Math.cos(u.dir)*u.speed*dt;
    c.position.z += Math.sin(u.dir)*u.speed*dt;
    const r = Math.hypot(c.position.x, c.position.z);
    if (r > 12.4 || r < 10.8) u.dir += Math.PI;
    c.position.y = SAND_Y + Math.abs(Math.sin(t*14 + u.legPhase))*0.02;
    c.rotation.y = -u.dir + Math.PI/2;
  });
}

function makePoints(count, size, color, spread, height, opts){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3), vel = [];
  for (let i=0;i<count;i++){
    pos[i*3]   = rand(-spread, spread);
    pos[i*3+1] = rand(0, height);
    pos[i*3+2] = rand(-spread, spread);
    vel.push({v:rand(0.7,1.6), ph:rand(0,9)});
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial(Object.assign({color, size, transparent:true, opacity:0.9, sizeAttenuation:true}, opts||{}));
  const pts = new THREE.Points(geo, mat);
  pts.visible = false;
  scene.add(pts);
  return {pts, vel, spread, height, count};
}

function updateFall(p, speed, sway, dt, t){
  const arr = p.pts.geometry.attributes.position.array;
  for (let i=0;i<p.count;i++){
    arr[i*3+1] -= p.vel[i].v * speed * dt;
    arr[i*3]   += Math.sin(t*1.5 + p.vel[i].ph) * sway * dt;
    if (arr[i*3+1] < 0.2){
      arr[i*3+1] = p.height;
      arr[i*3]   = rand(-p.spread, p.spread);
      arr[i*3+2] = rand(-p.spread, p.spread);
    }
  }
  p.pts.geometry.attributes.position.needsUpdate = true;
}

const btnDayNight = document.getElementById('btnDayNight');
btnDayNight.onclick = ()=>{
  const sunH = Math.sin(dayTime*Math.PI*2 - Math.PI/2);
  if (sunH >= 0){ dayTime = 0.85; btnDayNight.textContent = '☀️ 白天'; }
  else { dayTime = 0.35; btnDayNight.textContent = '🌙 夜晚'; }
};
const btnPause = document.getElementById('btnPause');
btnPause.onclick = ()=>{
  worldPaused = !worldPaused;
  btnPause.textContent = worldPaused ? '▶️' : '⏸️';
  btnPause.classList.toggle('active', worldPaused);
};
const btnMusic = document.getElementById('btnMusic');
btnMusic.onclick = function(){
  if (audio.playing){ audio.stop(); this.classList.remove('active'); }
  else { audio.start(); this.classList.add('active'); }
};
document.getElementById('btnShot').onclick = ()=>{
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'island_' + Date.now() + '.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

const seasonTargets = {grass:new THREE.Color(), sand:new THREE.Color(), water:new THREE.Color(), sky:new THREE.Color()};
function setSeason(s){
  season = s;
  const cfg = SEASONS[s];
  seasonTargets.grass.setHex(cfg.grass);
  seasonTargets.sand.setHex(cfg.sand);
  seasonTargets.water.setHex(cfg.water);
  seasonTargets.sky.setHex(cfg.skyDay);
  document.getElementById('label').textContent = cfg.label;
  btnSeason.textContent = cfg.btn + ' ▾';
  setWeather(s==='winter' ? 'snow' : 'clear');
  if (audio.playing) audio.setSeason(s);
}
function setWeather(w){
  weather = w;
  btnWeather.textContent = WEATHER_META[w].btn + ' ▾';
  btnWeather.classList.toggle('active', w!=='clear');
}

/* ================= BGM + 雷声 ================= */
const audio = {
  ctx:null, playing:false, timer:null, season:'spring',
  cfg:{
    spring:{notes:[523.25,587.33,659.25,783.99,880,1046.5], tempo:520, wave:'triangle', vol:0.10},
    summer:{notes:[440,493.88,554.37,659.25,739.99,880],    tempo:340, wave:'sawtooth',  vol:0.05},
    autumn:{notes:[440,523.25,587.33,659.25,783.99],        tempo:680, wave:'sine',     vol:0.12},
    winter:{notes:[659.25,783.99,880,1046.5,1318.5],        tempo:950, wave:'sine',     vol:0.09}
  },
  init(){
    if (this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.drone = this.ctx.createOscillator();
    this.droneGain = this.ctx.createGain();
    this.droneGain.gain.value = 0.025;
    this.drone.type = 'sine';
    this.drone.frequency.value = 130.81;
    this.drone.connect(this.droneGain).connect(this.ctx.destination);
    this.drone.start();
  },
  note(freq, cfg){
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = cfg.wave; o.frequency.value = freq;
    g.gain.setValueAtTime(cfg.vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (cfg.tempo/1000)*1.6);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + (cfg.tempo/1000)*1.7);
  },
  tick(){
    const cfg = this.cfg[this.season];
    if (Math.random() < 0.85) this.note(cfg.notes[Math.floor(Math.random()*cfg.notes.length)], cfg);
    if (Math.random() < 0.3) this.note(cfg.notes[0]/2, cfg);
  },
  setSeason(s){ this.season = s; },
  start(){
    this.init();
    this.ctx.resume();
    this.playing = true;
    this.timer = setInterval(()=>this.tick(), this.cfg[this.season].tempo);
  },
  stop(){ this.playing = false; clearInterval(this.timer); }
};
const sfx = {
  ctx: null,
  init(){
    if (this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    const len = this.ctx.sampleRate * 2.5;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  },
  thunder(){
    this.init();
    this.ctx.resume();
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const lowpass = this.ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.setValueAtTime(400, t);
    lowpass.frequency.exponentialRampToValueAtTime(60, t+2.2);
    const g = this.ctx.createGain();
    const vol = rand(0.25, 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.04);
    g.gain.exponentialRampToValueAtTime(vol*0.4, t+0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t+2.4);
    src.connect(lowpass).connect(g).connect(this.ctx.destination);
    src.start(t); src.stop(t+2.5);
  }
};

/* ================= 相机交互 ================= */
let dragging=false, lastX=0, lastY=0, pinchDist=0;
let camTheta=Math.PI/4, camPhi=0.95, camDist=42;
const camTarget = new THREE.Vector3(0, 3, 0);
renderer.domElement.addEventListener('pointerdown', e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  camTheta -= (e.clientX-lastX)*0.006;
  camPhi   -= (e.clientY-lastY)*0.006;
  camPhi = Math.max(0.25, Math.min(1.45, camPhi));
  lastX=e.clientX; lastY=e.clientY;
});
window.addEventListener('pointerup', ()=>dragging=false);
window.addEventListener('pointercancel', ()=>dragging=false);
window.addEventListener('wheel', e=>{
  camDist += e.deltaY*0.02;
  camDist = Math.max(15, Math.min(90, camDist));
}, {passive:true});
window.addEventListener('touchmove', e=>{
  if (e.touches.length===2){
    dragging=false;
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (pinchDist>0){ camDist += (pinchDist-d)*0.05; camDist=Math.max(15,Math.min(90,camDist)); }
    pinchDist = d;
  }
}, {passive:true});
window.addEventListener('touchend', ()=>pinchDist=0);
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
let prev = performance.now();
let worldT = 0;
const skyColor = new THREE.Color();
const flashColor = new THREE.Color(0xffffff);
let flash = 0, thunderCooldown = 3;

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const rawDt = Math.min((now-prev)/1000, 0.05); prev = now;
  const dt = worldPaused ? 0 : rawDt;
  worldT += dt;
  const t = worldT;

  /* 昼夜循环 */
  dayTime = (dayTime + dt/90*timeSpeed + 1) % 1;
  const sunAngle = dayTime * Math.PI*2 - Math.PI/2;
  const sunH = Math.sin(sunAngle);
  const dayF = Math.max(0, sunH);
  sunMesh.position.set(Math.cos(sunAngle)*80, sunH*80, -30);
  moonMesh.position.set(Math.cos(sunAngle+Math.PI)*80, -sunH*80, -30);
  sun.position.copy(sunMesh.position);
  moonLight.position.copy(moonMesh.position);
  moonLight.intensity = Math.max(0, -sunH)*0.35;

  skyColor.copy(nightSky).lerp(seasonTargets.sky, Math.min(1, dayF*1.6+0.08));
  scene.background.copy(skyColor);
  scene.fog.color.copy(skyColor);
  ambient.intensity = lerp(0.18, 0.6, dayF);
  sun.intensity = dayF*1.2;
  starMat.opacity = Math.max(0, -sunH*1.2);

  /* ⚡ 雷电 */
  if (weather === 'thunder' && userGestured && !worldPaused){
    thunderCooldown -= dt;
    if (Math.random() < dt*0.35){
      flash = 1;
      if (thunderCooldown <= 0){
        setTimeout(()=> sfx.thunder(), rand(100, 700));
        thunderCooldown = rand(2, 5);
      }
    }
  }
  flash = Math.max(0, flash - dt*3);
  flashLight.intensity = flash*1.8;
  scene.background.lerp(flashColor, flash*0.35);
  scene.fog.color.lerp(flashColor, flash*0.35);

  /* 材质颜色过渡 */
  grassMat.color.lerp(seasonTargets.grass, dt*2);
  sandMat.color.lerp(seasonTargets.sand, dt*2);
  waterMat.color.lerp(seasonTargets.water, dt*2);
  treeMats.forEach(({mat,isCherry},i)=>{
    let target;
    if (isCherry) target = new THREE.Color(SEASONS[season].cherry);
    else {
      const palette = SEASONS[season].tree;
      target = new THREE.Color(palette[i % palette.length]);
    }
    mat.color.lerp(target, dt*2);
  });
  const flowerTargetVisible = (season!=='winter' && weather!=='snow');
  flowers.forEach((f,i)=>{
    if (f.visible !== flowerTargetVisible && Math.random()<0.02) f.visible = flowerTargetVisible;
    f.rotation.z = Math.sin(t*1.2 + i)*0.08;
  });

  /* 夜间发光 */
  const nightF = Math.max(0, -sunH);
  beamMat.opacity = nightF*0.35;
  lampGlow.intensity = nightF*2;
  beamPivot.rotation.y = t*0.8;
  windowGlowMats.forEach(m=> m.opacity = nightF*0.9);
  lampGlows.forEach(m=> m.opacity = nightF);

  /* 大门开合动画 */
  doorPivot.rotation.y = lerp(doorPivot.rotation.y, doorOpenT*1.8, dt*7 || 0);

  /* 水面 */
  const wp = waterGeo.attributes.position;
  for (let i=0;i<wp.count;i++){
    const x=wp.getX(i), z=wp.getZ(i);
    if (Math.abs(x)<16 && Math.abs(z)<16) continue;
    wp.setY(i, Math.sin(x*0.35 + t*1.4)*0.22 + Math.cos(z*0.3 + t)*0.18);
  }
  wp.needsUpdate = true;

  /* ⛵ 小船：船头（尖的一端）始终指向前进方向 */
  boatState.angle += dt * boatState.speed;
  boat.position.set(
    Math.cos(boatState.angle)*boatState.radius,
    0.85 + Math.sin(t*1.2)*0.12,
    Math.sin(boatState.angle)*boatState.radius
  );
  boat.rotation.y = Math.PI - boatState.angle;  // ⭐ 修正：船头对准航行方向
  boat.rotation.z = Math.sin(t*0.9)*0.06;
  boat.rotation.x = Math.sin(t*0.7)*0.03;

  updateCrabs(dt, t);
  updateBunny(dt, t, nightF);
  updateSmoke(dt);

  clouds.forEach(c=>{
    c.position.x += c.userData.speed * dt * 60;
    if (c.position.x > 50) c.position.x = -50;
  });

  birds.forEach(b=>{
    b.visible = dayF > 0.15;
    if (!b.visible) return;
    const u = b.userData;
    const a = t*u.sp + u.ph;
    b.position.set(Math.cos(a)*u.r, u.h + Math.sin(t+u.ph)*0.8, Math.sin(a)*u.r);
    b.rotation.y = -a + (u.sp>0 ? Math.PI/2 : -Math.PI/2);
    const flap = Math.sin(t*10 + u.ph)*0.6;
    u.w1.rotation.y = flap; u.w2.rotation.y = -flap;
  });

  /* 粒子 */
  petalP.pts.visible   = (season==='spring' && weather==='clear');
  leafP.pts.visible    = (season==='autumn' && weather==='clear');
  fireflyP.pts.visible = (season==='summer' && nightF>0.3 && weather==='clear');
  snowP.pts.visible    = (weather==='snow');
  rainP.pts.visible    = (weather==='rain' || weather==='thunder');
  if (petalP.pts.visible)   updateFall(petalP, 1.2, 0.8, dt, t);
  if (leafP.pts.visible)    updateFall(leafP, 1.4, 1.2, dt, t);
  if (snowP.pts.visible)    updateFall(snowP, 0.8, 0.4, dt, t);
  if (rainP.pts.visible)    updateFall(rainP, 9,   0.1, dt, t);
  if (fireflyP.pts.visible){
    const arr = fireflyP.pts.geometry.attributes.position.array;
    for (let i=0;i<fireflyP.count;i++){
      arr[i*3]   += Math.sin(t*0.7 + fireflyP.vel[i].ph)*0.01;
      arr[i*3+1] += Math.cos(t*0.5 + fireflyP.vel[i].ph)*0.008;
      arr[i*3+2] += Math.cos(t*0.6 + fireflyP.vel[i].ph)*0.01;
    }
    fireflyP.pts.geometry.attributes.position.needsUpdate = true;
    fireflyP.pts.material.opacity = nightF;
  }

  camera.position.set(
    camTarget.x + camDist*Math.sin(camPhi)*Math.cos(camTheta),
    camTarget.y + camDist*Math.cos(camPhi),
    camTarget.z + camDist*Math.sin(camPhi)*Math.sin(camTheta)
  );
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
}
setSeason('spring');
animate();
</script>
