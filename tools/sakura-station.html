<script>
function start(){
try {
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* ===== 工具（缓存 + 一行摆件）===== */
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const blobGeo=new THREE.SphereGeometry(1,10,8);
const petalGeo=new THREE.SphereGeometry(1,7,6);
const MATS={},GEOS={};
function M(c,o){const k=c+JSON.stringify(o||{});if(!MATS[k])MATS[k]=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));return MATS[k]}
function B(c){const k='b'+c;if(!MATS[k])MATS[k]=new THREE.MeshBasicMaterial({color:c});return MATS[k]}
function box(w,h,d,r){
  const k=w+','+h+','+d+','+(r||0);
  if(GEOS[k])return GEOS[k];
  r=Math.min(r,w/2-.01,h/2-.01,d/2-.01);
  const s=new THREE.Shape(),hw=w/2-r,hh=h/2-r;
  s.moveTo(-hw,-hh);s.lineTo(hw,-hh);s.lineTo(hw,hh);s.lineTo(-hw,hh);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:2,curveSegments:3});
  g.center();GEOS[k]=g;return g;
}
function P(parent,geo,m,x,y,z,ry){
  const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);
  if(ry)o.rotation.y=ry;parent.add(o);return o;
}
function tex(w,h,draw){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  draw(cv.getContext('2d'),w,h);return new THREE.CanvasTexture(cv);
}
function sign(t,fs,bg,fg){
  return new THREE.MeshBasicMaterial({map:tex(256,72,(c)=>{
    c.fillStyle=bg;c.fillRect(0,0,256,72);
    c.fillStyle=fg;c.font='bold '+fs+'px sans-serif';
    c.textAlign='center';c.textBaseline='middle';c.fillText(t,128,36);
  })});
}
const PASTEL=['#e8938a','#f2c94c','#8fbf7a','#7aa8c9','#d9a8e0','#f0a8b8','#e8a06a','#a8d0c0'];
function flower(parent,x,y,z,s,cp){
  const g=new THREE.Group();
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2,p=new THREE.Mesh(petalGeo,M(cp));
    p.scale.set(s*.42,s*.16,s*.42);p.position.set(Math.cos(a)*s*.38,0,Math.sin(a)*s*.38);g.add(p);
  }
  const c=new THREE.Mesh(petalGeo,M(0xf7d774));c.scale.setScalar(s*.2);c.position.y=s*.12;g.add(c);
  g.position.set(x,y,z);g.rotation.y=rand(0,Math.PI);parent.add(g);return g;
}

/* ===== 🌸 五瓣花网格合并器（顶点色烘焙，一树一 Mesh）===== */
function mergeGeos(parts){
  let vc=0,ic=0;
  parts.forEach(p=>{vc+=p.geo.attributes.position.count;ic+=p.geo.index.count});
  const pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),col=new Float32Array(vc*3);
  const idx=vc>65535?new Uint32Array(ic):new Uint16Array(ic);
  let vo=0,io=0;
  const v=new THREE.Vector3(),m3=new THREE.Matrix3();
  parts.forEach(p=>{
    const g=p.geo,n=g.attributes.position.count;
    m3.getNormalMatrix(p.m);
    const pa=g.attributes.position.array,na=g.attributes.normal.array;
    for(let i=0;i<n;i++){
      v.set(pa[i*3],pa[i*3+1],pa[i*3+2]).applyMatrix4(p.m);
      pos[(vo+i)*3]=v.x;pos[(vo+i)*3+1]=v.y;pos[(vo+i)*3+2]=v.z;
      v.set(na[i*3],na[i*3+1],na[i*3+2]).applyMatrix3(m3).normalize();
      nor[(vo+i)*3]=v.x;nor[(vo+i)*3+1]=v.y;nor[(vo+i)*3+2]=v.z;
      col[(vo+i)*3]=p.c.r;col[(vo+i)*3+1]=p.c.g;col[(vo+i)*3+2]=p.c.b;
    }
    const ia=g.index.array;
    for(let i=0;i<ia.length;i++)idx[io+i]=ia[i]+vo;
    vo+=n;io+=ia.length;
  });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  return geo;
}
const blossomMat=new THREE.MeshLambertMaterial({vertexColors:true});
const _m4=new THREE.Matrix4(),_v3=new THREE.Vector3(),_q0=new THREE.Quaternion(),_c3=new THREE.Color();
function addFlower(parts,x,y,z,s,petHex){
  const pc=_c3.setHex(petHex).clone(),cc=new THREE.Color(0xf7d774);
  const off=rand(0,Math.PI*2);
  for(let i=0;i<5;i++){
    const a=off+i/5*Math.PI*2;
    parts.push({geo:petalGeo,
      m:new THREE.Matrix4().compose(_v3.set(x+Math.cos(a)*s*.38,y,z+Math.sin(a)*s*.38),_q0,new THREE.Vector3(s*.42,s*.16,s*.42)),
      c:pc});
  }
  parts.push({geo:petalGeo,
    m:new THREE.Matrix4().compose(_v3.set(x,y+s*.12,z),_q0,new THREE.Vector3(s*.2,s*.2,s*.2)),
    c:cc});
}

/* ===== 登记表 ===== */
const snowSlabs=[],lampLights=[],glowMats=[],ripples=[],trees=[],workers=[],commuters=[],
      bubbles=[],clickables=[],ducks=[],kois=[],butterflies=[],puddles=[],fireflies=[];
let storeDoorL=null,storeDoorR=null,catG=null;
function reg(obj,lines){obj.userData.lines=lines;clickables.push(obj)}

const C={day:new THREE.Color(0xf4ece4),night:new THREE.Color(0x2b3350),sunset:new THREE.Color(0xf0a468),
         clD:new THREE.Color(0xe3e6ea),raD:new THREE.Color(0xc9d0d8),snD:new THREE.Color(0xf1f3f5)};
const bgCol=C.day.clone();scene.background=bgCol;
const ambient=new THREE.AmbientLight(0xffffff,.62);scene.add(ambient);
const hemi=new THREE.HemisphereLight(0xfffaf4,0xd8c8b8,.35);scene.add(hemi);
const keyLight=new THREE.DirectionalLight(0xfff2e2,.72);keyLight.position.set(-8,18,10);scene.add(keyLight);
const fill=new THREE.DirectionalLight(0xe8f0ff,.2);fill.position.set(10,8,-6);scene.add(fill);
{
  const g=tex(256,256,(c)=>{
    const gr=c.createRadialGradient(128,128,30,128,128,126);
    gr.addColorStop(0,'rgba(120,100,90,.3)');gr.addColorStop(1,'rgba(120,100,90,0)');
    c.fillStyle=gr;c.fillRect(0,0,256,256);
  });
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshBasicMaterial({map:g,transparent:true,depthWrite:false}));
  sh.rotation.x=-Math.PI/2;sh.position.y=-1.12;scene.add(sh);
}

/* ===== 💬 对话气泡 + 点击 ===== */
function showBubble(obj,text){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(320,120,(c)=>{
    c.fillStyle='rgba(255,253,248,.96)';
    c.beginPath();c.moveTo(36,10);c.arcTo(310,10,310,86,26);c.arcTo(310,86,10,86,26);
    c.arcTo(10,86,10,10,26);c.arcTo(10,10,310,10,26);c.closePath();c.fill();
    c.beginPath();c.moveTo(140,84);c.lineTo(180,84);c.lineTo(160,112);c.closePath();c.fill();
    c.fillStyle='#4a4038';c.font='bold 30px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText(text,160,48,280);
  }),transparent:true,depthTest:false}));
  sp.scale.set(1.9,.71,1);sp.renderOrder=999;scene.add(sp);
  bubbles.push({sp,obj,t:0});
  if(bubbles.length>4){const o=bubbles.shift();scene.remove(o.sp);o.sp.material.dispose()}
}
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function handleClick(cx,cy){
  ndc.x=cx/innerWidth*2-1;ndc.y=-cy/innerHeight*2+1;
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(clickables,true);
  for(let i=0;i<hits.length;i++){
    let o=hits[i].object;
    while(o&&!o.userData.lines)o=o.parent;
    if(o&&o.userData.lines){
      showBubble(o,o.userData.lines[(Math.random()*o.userData.lines.length)|0]);
      if(o===trainGroup&&audio.ctx)audio.horn();
      return;
    }
  }
}

/* ===== 底盘 / 富士山 ===== */
const grassMat=M(0x96c47c);
[[22,.9,22,grassMat,.45],[22.5,.45,22.5,M(0xded4c6),.225],[22,.45,22,M(0xcabfae),-.225],[21.2,.45,21.2,M(0xb5a695),-.675]]
  .forEach(([w,h,d,m,y])=>P(scene,box(w,h,d,.12),m,0,y,0));
const sunMat=M(0xe8574a);
let sunMesh;
{
  const fuji=new THREE.Group(),H=9.5;
  const pts=[new THREE.Vector2(0,H+.06),new THREE.Vector2(.5,H+.02),new THREE.Vector2(.78,H-.12)];
  for(let i=1;i<=12;i++){const t=i/12;pts.push(new THREE.Vector2(.78+Math.pow(t,1.7)*4.15,(H-.12)-t*(H-.12)))}
  fuji.add(new THREE.Mesh(new THREE.LatheGeometry(pts,26),M(0x6f9bd6,{side:THREE.DoubleSide})));
  const sp=[new THREE.Vector2(0,H+.09),new THREE.Vector2(.52,H+.05),new THREE.Vector2(.84,H-.10)];
  for(let i=1;i<=6;i++){const t=i/6*.34;sp.push(new THREE.Vector2(.84+Math.pow(t,1.7)*4.15+.07,(H-.10)-t*(H-.12)))}
  fuji.add(new THREE.Mesh(new THREE.LatheGeometry(sp,26),M(0xfbfaf5,{side:THREE.DoubleSide})));
  for(let i=0;i<13;i++){
    const a=i/13*Math.PI*2,s=new THREE.Mesh(blobGeo,M(0xfbfaf5));
    s.scale.setScalar(rand(.14,.21));s.position.set(Math.cos(a)*1.48,6.12+rand(-.08,.08),Math.sin(a)*1.48);fuji.add(s);
  }
  fuji.position.set(-9.4,.9,1.5);fuji.scale.setScalar(.45);scene.add(fuji);
  sunMesh=P(scene,new THREE.CylinderGeometry(.95,.95,.2,26),sunMat,-11.2,5.6,1.5);
  sunMesh.rotation.x=Math.PI/2;
}

/* ===== 🌸 樱花树：整树 = 花簇合并网格 ===== */
{
  const crown=[0xf6b9c9,0xf9cbd6,0xd9a8e0,0xfdeef2];
  const spot=[[8.4,-2.2,1],[8.3,4.6,1.05],[7.6,-8.2,1],[8.8,-6.4,.9],[-8.2,7.2,.95],[-8.5,-4.6,.9],
              [2.6,9.2,.85],[-2.6,9.3,.9],[6.6,8.8,.85],[-4.6,8.9,.85],[-3,-8.8,.85]];
  spot.forEach(([x,z,s])=>{
    const g=new THREE.Group();
    P(g,new THREE.CylinderGeometry(.13,.2,1.05,10),M(0x9a6b52),0,.5,0);
    const fork=new THREE.Mesh(blobGeo,M(0x9a6b52));fork.scale.set(.24,.18,.24);fork.position.y=1;g.add(fork);
    /* 枝干 */
    [[.28,.5,-.1],[-.3,.45,.15],[.05,.62,.3],[-.12,.55,-.28]].forEach(([bx,by,bz])=>{
      const br=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.65,7),M(0x9a6b52));
      br.position.set(bx,by+ .95,bz);br.rotation.set(bz*1.2,0,-bx*1.4);g.add(br);
    });
    /* 花簇：16~22 朵五瓣花，顶点色合并成 1 个 Mesh */
    const parts=[],n=16+(rand(0,6)|0);
    for(let i=0;i<n;i++)
      addFlower(parts,rand(-.58,.58),1.35+rand(0,.48),rand(-.58,.58),rand(.26,.42),crown[(Math.random()*4)|0]);
    g.add(new THREE.Mesh(mergeGeos(parts),blossomMat));
    g.position.set(x,.9,z);g.scale.setScalar(s);scene.add(g);
    trees.push({g,ph:rand(0,6)});
  });
}
{ /* 盆栽松 + 折扇 */
  const g=new THREE.Group();
  P(g,new THREE.CylinderGeometry(.4,.3,.38,14),M(0xc97a5a),0,.19,0);
  P(g,new THREE.CylinderGeometry(.055,.08,.55,8),M(0x8a5a40),0,.68,0);
  [[.16,1.02,.42,.3],[-.22,.88,.34,.26],[.02,1.22,.28,.22]].forEach(([x,y,sx,sy])=>{
    const l=new THREE.Mesh(blobGeo,M(0x8fbf7a));l.scale.set(sx,sy,sx);l.position.set(x,y,0);g.add(l);
  });
  g.position.set(.2,.9,4.3);scene.add(g);
}
const fanHolders=[];
{
  const g=new THREE.Group();
  P(g,new THREE.CylinderGeometry(.09,.11,.1,10),M(0xd8b07a),0,.05,0);
  for(let i=-3;i<=3;i++){
    const h=new THREE.Group();h.userData.i=i;
    P(h,box(.09,.78,.045,.02),M(0xf8f4ec),0,.44,0);g.add(h);fanHolders.push(h);
  }
  g.position.set(1.7,1,3.9);g.rotation.y=.55;g.rotation.z=-.12;scene.add(g);
}

/* ===== 🛤️ 环线轨道 ===== */
{
  const ball=M(0xcfc8ba),tie=M(0x8a6a4a),rail=M(0xa8a8ae);
  [6.2,-6.2].forEach(x=>{
    P(scene,box(2,.14,9.2,.05),ball,x,.97,0);
    [-.5,.5].forEach(dx=>P(scene,box(.1,.1,9.2,.04),rail,x+dx,1.15,0));
    for(let i=0;i<9;i++)P(scene,box(1.7,.08,.3,.03),tie,x,1.07,-4.1+i*1.025);
  });
  P(scene,box(9.2,.14,2,.05),ball,0,.97,6.2);
  [-.5,.5].forEach(dz=>P(scene,box(9.2,.1,.1,.04),rail,0,1.15,6.2+dz));
  for(let i=0;i<9;i++)P(scene,box(.3,.08,1.7,.03),tie,-4.1+i*1.025,1.07,6.2);
  [-3.65,3.65].forEach(x=>P(scene,box(1.9,.14,2,.05),ball,x,.97,-6.2));
  [-.5,.5].forEach(dz=>P(scene,box(9.2,.1,.1,.04),rail,0,1.15,-6.2+dz));
  for(let i=0;i<9;i++){
    const x=-4.1+i*1.025;
    if(Math.abs(x)<2.7)continue;
    P(scene,box(.3,.08,1.7,.03),tie,x,1.07,-6.2);
  }
  [[4.6,4.6,0],[-4.6,4.6,Math.PI/2],[-4.6,-4.6,Math.PI],[4.6,-4.6,-Math.PI/2]].forEach(([cx,cz,a0])=>{
    const n=8,da=Math.PI/2/n;
    for(let i=0;i<n;i++){
      const am=a0+da*(i+.5),ch=2*1.6*Math.sin(da/2);
      const bx=cx+1.6*Math.cos(am),bz=cz+1.6*Math.sin(am);
      P(scene,box(ch+.08,.14,2,.05),ball,bx,.97,bz,-am);
      P(scene,box(1.7,.08,.3,.03),tie,bx,1.07,bz,-am);
      [1.1,2.1].forEach(r=>P(scene,box(.1,.1,ch+.04,.04),rail,cx+r*Math.cos(am),1.15,cz+r*Math.sin(am),-am));
    }
  });
}

/* ===== 🏞️ 水系（水车已移除）===== */
{
  const wm=M(0x7fb6d9),dm=M(0x6aa6cc);
  P(scene,new THREE.BoxGeometry(7.2,.1,2.6),wm,0,.9,-6.2);
  P(scene,new THREE.BoxGeometry(7.2,.02,1.4),dm,0,.955,-6.2);
  [-7.62,-4.78].forEach(z=>P(scene,box(7.4,.1,.36,.05),M(0xd9cdb0),0,.9,z));
  P(scene,new THREE.CylinderGeometry(1.05,1.05,.1,24),wm,1,.9,-3.5);
  P(scene,new THREE.CylinderGeometry(.8,.8,.02,24),dm,1,.955,-3.5);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(1.05,.07,8,24),M(0xcabfae));
  rim.rotation.x=Math.PI/2;rim.position.set(1,.97,-3.5);scene.add(rim);
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI*2+.3,st=new THREE.Mesh(blobGeo,M(0xb5a695));
    st.scale.set(rand(.08,.13),rand(.05,.08),rand(.08,.13));
    st.position.set(1+Math.cos(a)*1.12,.95,-3.5+Math.sin(a)*1.12);st.rotation.set(rand(0,3),rand(0,3),rand(0,3));scene.add(st);
  }
  P(scene,new THREE.BoxGeometry(.55,.1,.9),wm,1,.9,-4.62);
  [[.55,-3.3],[1.45,-3.75],[.9,-3.9]].forEach(([x,z],i)=>{
    P(scene,new THREE.CylinderGeometry(.12,.12,.02,10),M(0x6a9a5a),x,.965,z);
    if(i===1)flower(scene,x,1.05,z,.16,0xf6b9c9);

const L=9.2,CC=Math.PI/2*1.6,LOOP_L=4*L+4*CC,S_STOP=5.5;
const S_BRIDGE=3*L+3*CC+2.4,S_BRIDGE_END=S_BRIDGE+4.4;
function pathAt(s){
  s=((s%LOOP_L)+LOOP_L)%LOOP_L;
  if(s<L)return{x:6.2,z:-4.6+s,a:0};s-=L;
  if(s<CC){const t=s/1.6;return{x:4.6+1.6*Math.cos(t),z:4.6+1.6*Math.sin(t),a:-t}}s-=CC;
  if(s<L)return{x:4.6-s,z:6.2,a:-Math.PI/2};s-=L;
  if(s<CC){const p=s/1.6;return{x:-4.6-1.6*Math.sin(p),z:4.6+1.6*Math.cos(p),a:Math.atan2(-Math.cos(p),-Math.sin(p))}}s-=CC;
  if(s<L)return{x:-6.2,z:4.6-s,a:Math.PI};s-=L;
  if(s<CC){const p=s/1.6;return{x:-4.6-1.6*Math.cos(p),z:-4.6-1.6*Math.sin(p),a:Math.PI-p}}s-=CC;
  if(s<L)return{x:-4.6+s,z:-6.2,a:Math.PI/2};s-=L;
  const p=s/1.6;return{x:4.6+1.6*Math.sin(p),z:-4.6-1.6*Math.cos(p),a:Math.PI/2-p};
}
const TRAIN={s:S_STOP-12,v:0,phase:'run',pt:0,door:0,lastDs:0,minRun:0,horned:false};
const V=2.2,BRK_A=V*V/(2*4.15),T_DWELL=8.5;
function updateTrain(dt,t){
  TRAIN.pt+=dt;
  if(TRAIN.phase==='run'){
    const toStop=((S_STOP-TRAIN.s)%LOOP_L+LOOP_L)%LOOP_L;
    let tg=V;
    if(TRAIN.minRun<=0&&toStop<4.2)tg=Math.max(0,Math.sqrt(2*BRK_A*toStop));
    TRAIN.v=TRAIN.v<tg?Math.min(tg,TRAIN.v+.55*dt):Math.max(tg,TRAIN.v-BRK_A*dt*1.3);
    let ds=TRAIN.v*dt;
    if(TRAIN.minRun>0)TRAIN.minRun-=ds;
    if(TRAIN.minRun<=0&&toStop-ds<=.002){
      TRAIN.s=S_STOP;TRAIN.v=0;ds=0;TRAIN.phase='dwell';TRAIN.pt=0;TRAIN.door=0;
      chime();
    }else TRAIN.s=(TRAIN.s+ds)%LOOP_L;
    TRAIN.lastDs=ds;
    const onBridge=TRAIN.s>S_BRIDGE&&TRAIN.s<S_BRIDGE_END;
    if(onBridge&&!TRAIN.horned){TRAIN.horned=true;if(audio.ctx)audio.horn()}
    if(TRAIN.s>S_BRIDGE_END)TRAIN.horned=false;
  }else{
    TRAIN.lastDs=0;
    const d=TRAIN.pt/T_DWELL;
    TRAIN.door=d<.14?d/.14:d>.86?Math.max(0,(1-d)/.14):1;
    if(TRAIN.pt>=T_DWELL){TRAIN.phase='run';TRAIN.v=0;TRAIN.pt=0;TRAIN.door=0;TRAIN.minRun=2.5}
  }
  const p=pathAt(TRAIN.s);
  trainGroup.position.set(p.x,0,p.z);trainGroup.rotation.y=p.a;
  const mv=TRAIN.v>.05;
  trainGroup.rotation.z=mv?Math.sin(t*9)*.006:0;
  trainGroup.rotation.x=mv?Math.cos(t*7)*.004:0;
  if(TRAIN.lastDs)wheels.forEach(w=>w.rotation.x+=TRAIN.lastDs/.16);
  doors.forEach(d=>d.m.position.z=d.base+Math.sign(d.base)*.32*TRAIN.door);
  if(driverArm)driverArm.rotation.z=TRAIN.phase==='dwell'?-.7+Math.sin(t*9)*.35:-.35;
}

/* ✅ 走步器：高度用 wy 缓存逼近 + 弹跳只做显示偏移，不再累加 */
function step(p,dt,t){
  const tg=p.wps[p.wi],dx=tg.x-p.g.position.x,dz=tg.z-p.g.position.z,d=Math.hypot(dx,dz);
  if(d<.06){p.wi++;return p.wi>=p.wps.length}
  const f=Math.min(1,p.speed*dt/d);
  p.g.position.x+=dx*f;p.g.position.z+=dz*f;
  if(p.wy===undefined)p.wy=p.g.position.y;
  p.wy+=(tg.y-p.wy)*Math.min(1,dt*5);
  p.g.position.y=p.wy+Math.abs(Math.sin(t*11+p.ph))*.03;
  p.g.rotation.y=Math.atan2(dx,dz);
  p.g.rotation.z=Math.sin(t*11+p.ph)*.06;
  return false;
}

      }else if(p.state==='walk'){

          p.g.scale.setScalar(.72);
          p.g.position.set(0,1.62,.6);p.g.rotation.set(0,-Math.PI/2,0);p.wy=undefined;
          trainGroup.add(p.g);p.g.visible=true;
          p.state='gone';p.inCar=true;
        }
      }
      return;
    }
    switch(p.state){
      case 'inTrain':
        if(doorOK()&&TRAIN.pt>=p.spawnAt){
          p.state='walk';p.wi=0;p.t=0;p.wy=undefined;p.g.visible=true;
          p.g.scale.setScalar(P_SCALE);
          if(p.g.userData.shopBag)p.g.userData.shopBag.visible=false;
          p.g.position.set(p.exit.x,p.exit.y,p.exit.z);
        }
        break;
      case 'walk':
        if(step(p,dt,t)){p.state='fade';p.t=0}break;
      case 'fade':
        p.t+=dt;p.g.scale.setScalar(Math.max(.001,P_SCALE*(1-p.t/.6)));
        if(p.t>=.6){p.g.visible=false;p.state='shopping';p.t=0}break;
      case 'shopping':
        p.t+=dt;
        if(p.t>=5){
          p.state='walkBack';p.wi=0;p.wy=undefined;p.g.visible=true;
          p.g.scale.setScalar(P_SCALE);
          p.g.position.set(DOOR_IN.x,.9,DOOR_IN.z);
          if(p.g.userData.shopBag)p.g.userData.shopBag.visible=true;
        }
        break;
      case 'walkBack':
        if(step(p,dt,t))p.state='waitPlatform';break;
      case 'waitPlatform':
        p.g.rotation.z=Math.sin(t*2+p.ph)*.02;
        if(doorOK()&&TRAIN.pt>=5.2){
          p.state='boardWalk';p.wi=0;p.wy=undefined;
          p.wps=[{x:4.9,y:1.38,z:1.2},{x:5.1,y:1.36,z:1}];
        }
        break;
      case 'boardWalk':
        if(step(p,dt,t)){p.state='fade2';p.t=0}break;
      case 'fade2':
        p.t+=dt;p.g.scale.setScalar(Math.max(.001,P_SCALE*(1-p.t/.4)));
        if(p.t>=.4){p.g.visible=false;p.state='gone2';p.g.scale.setScalar(P_SCALE)}break;
    }
  });
  if(TRAIN.phase==='run'&&TRAIN.s>22&&TRAIN.s<29)passengers.forEach(p=>{
    if(p.role==='board'&&p.state==='gone'){
      if(p.inCar){trainGroup.remove(p.g);scene.add(p.g);p.inCar=false}
      p.g.visible=true;p.state='waiting';p.g.scale.setScalar(P_SCALE);p.wy=undefined;
      p.g.position.set(p.waitPos.x,p.waitPos.y,p.waitPos.z);p.g.rotation.set(0,Math.PI/2,0);
    }
    if(p.role==='exit'&&p.state==='gone2'){
      p.g.visible=false;p.state='inTrain';p.g.scale.setScalar(P_SCALE);p.wy=undefined;
      if(p.g.userData.shopBag)p.g.userData.shopBag.visible=false;
    }
  });
}

function blocked(x,z){
  const qx=Math.abs(x)-4.6,qz=Math.abs(z)-4.6;
  const d=Math.hypot(Math.max(qx,0),Math.max(qz,0))+Math.min(Math.max(qx,qz),0)-1.6;
  if(Math.abs(d)<1.45)return true;
  if(Math.abs(z+6.2)<1.7&&Math.abs(x)<3.9)return true;
  if(Math.hypot(x-1,z+3.5)<1.4)return true;
  if(Math.abs(x-1)<.55&&z<-4.3&&z>-5.2)return true;
  if(x>3.6&&x<5.6&&z>-1.6&&z<4.8)return true;
  if(x>-3.6&&x<1.2&&z>-2.4&&z<1.2)return true;
  if(x<-7.2&&Math.abs(z-1.5)<2.6)return true;
  if(Math.abs(x+7.6)<1.4&&Math.abs(z+9.3)<1.4)return true;
  if(Math.abs(x+4.6)<.7&&Math.abs(z-3.4)<.7)return true;
  return false;
}

  cricket(t){
    for(let i=0;i<4;i++){
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine';o.frequency.value=4200;
      g.gain.setValueAtTime(.008,t+i*.06);g.gain.exponentialRampToValueAtTime(.0001,t+i*.06+.04);
      o.connect(g).connect(this.ctx.destination);o.start(t+i*.06);o.stop(t+i*.06+.05);
    }
  },
  horn(){
    const t0=this.ctx.currentTime;
    [[784,0,.4],[784,.5,.7]].forEach(([f,d,dur])=>{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.07,t0+d);g.gain.setValueAtTime(.07,t0+d+dur-.08);
      g.gain.linearRampToValueAtTime(.0001,t0+d+dur);
      o.connect(g).connect(this.ctx.destination);o.start(t0+d);o.stop(t0+d+dur+.02);
    });
  },
  tick(){
    const ahead=this.ctx.currentTime+.8,beat=60/72;
    while(this.nextT<ahead){
      const e=SEQ[this.idx];
      if(e.f)this.pluck(e.f,this.nextT,e.b);
      BASS.forEach(([bt,f,ch])=>{
        if(Math.abs(bt-e.t)<.01){
          this.bass(f,this.nextT);
          ch.forEach((cf,k)=>this.arp(cf*2,this.nextT+k*.14));
        }
      });
      this.nextT+=e.b*beat;this.idx=(this.idx+1)%SEQ.length;
    }
    if(dayF>.6&&Math.random()<.03){const n=1+(Math.random()*3|0);for(let i=0;i<n;i++)this.chirp(this.ctx.currentTime+i*.14)}
    if(nightF>.6&&Math.random()<.12)this.cricket(this.ctx.currentTime);
    if(this.rainGain)this.rainGain.gain.value=wetF*.05;
  },
  start(){this.init();this.ctx.resume();this.idx=0;this.nextT=this.ctx.currentTime+.15;this.playing=true;this.timer=setInterval(()=>this.tick(),200)},
  stop(){this.playing=false;clearInterval(this.timer)}
};
$('btnMusic').onclick=function(){
  if(audio.playing){audio.stop();this.classList.remove('active')}
  else{audio.start();this.classList.add('active')}
};

/* ===== 相机（机位 + 跟车 + 点击）===== */
let dragging=false,lastX=0,lastY=0,pinch=0,downX=0,downY=0;
let camT=.42,camP=.95,camD=29;
const camTarget=new THREE.Vector3(0,4,0),camHome=new THREE.Vector3(0,4,0);
const CAMS={camView:{t:.42,p:.95,d:29,g:[0,4,0]},camStation:{t:2.2,p:1.15,d:9.5,g:[4.6,1.8,1]},
            camBridge:{t:-1.15,p:1.1,d:11,g:[0,2,-6.2]},camShop:{t:.12,p:1.18,d:6.5,g:[-1.2,1.6,1.4]}};
function setCam(id){
  follow=false;$('camFollow').classList.remove('active');
  ['camView','camStation','camBridge','camShop'].forEach(k=>$(k).classList.remove('active'));
  $(id).classList.add('active');
  const c=CAMS[id];camT=c.t;camP=c.p;camD=c.d;camHome.set(c.g[0],c.g[1],c.g[2]);
}
Object.keys(CAMS).forEach(id=>$(id).onclick=()=>setCam(id));
$('camFollow').onclick=function(){
  follow=!follow;this.classList.toggle('active',follow);
  if(!follow)setCam('camView');
};
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=downX=e.clientX;lastY=downY=e.clientY});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  camT-=(e.clientX-lastX)*.005;camP-=(e.clientY-lastY)*.004;
  camP=Math.max(.35,Math.min(1.45,camP));lastX=e.clientX;lastY=e.clientY;
});
addEventListener('pointerup',e=>{
  if(dragging&&Math.hypot(e.clientX-downX,e.clientY-downY)<6)handleClick(e.clientX,e.clientY);
  dragging=false;
});
addEventListener('pointercancel',()=>dragging=false);
addEventListener('wheel',e=>{camD=Math.max(6,Math.min(55,camD+e.deltaY*.02))},{passive:true});
addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    dragging=false;
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch>0)camD=Math.max(6,Math.min(55,camD+(pinch-d)*.05));
    pinch=d;
  }
},{passive:true});
addEventListener('touchend',()=>pinch=0);
$('zoomIn').onclick=()=>camD=Math.max(6,camD*.85);
$('zoomOut').onclick=()=>camD=Math.min(55,camD*1.18);
$('resetBtn').onclick=()=>setCam('camView');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const TODK=[[0,1,0,0],[.3,1,0,0],[.4,0,1,0],[.55,0,1,0],[.65,0,0,1],[.9,0,0,1],[1,1,0,0]];
function todW(tt){
  const c=(tt%150)/150;
  for(let i=0;i<TODK.length-1;i++){
    const a=TODK[i],b=TODK[i+1];
    if(c<=b[0]){const k=(c-a[0])/(b[0]-a[0]);return[lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)]}
  }
  return[1,0,0];
}

/* ===== 主循环 ===== */
let prev=performance.now(),worldT=0,doorF=0;
const tmpV=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),dt=paused?0:Math.min((now-prev)/1000,.05);
  prev=now;worldT+=dt;const t=worldT;
  let tD=1,tS=0,tN=0;
  if(autoTod){const w=todW(worldT);tD=w[0];tS=w[1];tN=w[2]}
  else if(tod==='sunset'){tD=0;tS=1}else if(tod==='night'){tD=0;tN=1}
  dayF=lerp(dayF,tD,Math.min(1,dt*1.6));
  sunsetF=lerp(sunsetF,tS,Math.min(1,dt*1.6));
  nightF=lerp(nightF,tN,Math.min(1,dt*1.6));
  const w=W[weatherName];
  tc.copy(w.bg).lerp(C.sunset,sunsetF).lerp(C.night,nightF);
  bgCol.lerp(tc,Math.min(1,dt*2.2));
  ambient.intensity=lerp(lerp(w.amb,.5,sunsetF),.3,nightF);
  hemi.intensity=lerp(.35,.12,nightF);
  keyLight.intensity=lerp(lerp(w.key,.55,sunsetF),.1,nightF);
  keyLight.color.setHex(0xfff2e2);
  tc.setHex(0xffb27a);keyLight.color.lerp(tc,sunsetF);
  tc.setHex(0x8090c0);keyLight.color.lerp(tc,nightF);
  snowF=lerp(snowF,weatherName==='snow'?1:0,Math.min(1,dt*1.5));
  grassMat.color.copy(GRASS_D).lerp(GRASS_SNOW,snowF);
  snowSlabs.forEach(m=>m.opacity=snowF*.95);
  winMat.color.copy(WIN_D).lerp(WIN_N,Math.max(nightF,sunsetF*.6));
  fallMat.color.lerp(tc.setHex(w.pc),Math.min(1,dt*2.2));
  fallMat.opacity=lerp(fallMat.opacity,w.po,Math.min(1,dt*2.2));
  part.speed=lerp(part.speed,weatherName==='rain'?3.2:weatherName==='snow'?.65:weatherName==='cloudy'?.4:.45,Math.min(1,dt*2.2));
  part.sway=lerp(part.sway,weatherName==='rain'?.05:weatherName==='snow'?.9:weatherName==='cloudy'?.4:.5,Math.min(1,dt*2.2));
  const wetT=weatherName==='rain'?1:0;
  wetF+=(wetT-wetF)*Math.min(1,dt*(wetT?.5:.06));
  puddles.forEach(p=>p.material.opacity=wetF*.6);
  if(!paused){
    updateFall(dt,t);updateTrain(dt,t);updatePassengers(dt,t);
    updateCommuters(dt,t);updateDucks(dt,t);updateKoi(dt,t);
    updateButterflies(dt,t);updateDogWalk(dt,t);updateFisher(dt,t);
    let near=false;
    passengers.forEach(p=>{
      if(p.state==='walk'&&p.role==='exit'&&Math.hypot(p.g.position.x-DOOR_OUT.x,p.g.position.z-DOOR_OUT.z)<1.1)near=true;
    });
    doorF=lerp(doorF,near?1:0,Math.min(1,dt*5));
    if(storeDoorL){storeDoorL.position.x=.8625-.38*doorF;storeDoorR.position.x=1.3875+.38*doorF}
  }
  glowMats.forEach(m=>m.opacity=nightF*.95);
  lampLights.forEach(l=>l.intensity=nightF*1.5);
  moon.material.opacity=nightF*.95;
  sunMat.opacity=1-nightF;
  sunMesh.position.y=5.6-sunsetF*4+Math.sin(t*.5)*.12*(1-sunsetF);
  starsMat.opacity=nightF*.9;
  meteorNext-=dt;
  if(meteorNext<=0&&meteorT<0){meteorT=0;meteorNext=rand(6,13);meteorStart.set(rand(-8,8),rand(10.5,12.5),rand(-10,-5))}
  if(meteorT>=0){
    meteorT+=dt;const k=meteorT/.8;
    if(k>=1||nightF<.3){meteorT=-1;meteor.visible=false}
    else{
      meteor.visible=true;
      meteor.position.set(meteorStart.x+2.4*k,meteorStart.y-3.6*k,meteorStart.z+1.4*k);
      meteor.material.opacity=nightF*(1-k);
    }
  }
  const fg=Math.min(1,nightF+sunsetF*.35);
  fireflies.forEach(grp=>{
    const tw=.5+.5*Math.sin(t*2.2+grp.ph);
    grp.m.opacity=fg*(.25+.75*tw);
    grp.items.forEach(s=>{
      const b=s.userData.base,ph=s.userData.ph;
      s.position.set(b[0]+Math.sin(t*.6+ph)*.25,b[1]+Math.sin(t*.9+ph*2)*.12,b[2]+Math.cos(t*.5+ph)*.25);
    });
  });
  trees.forEach(tr=>{tr.g.rotation.z=Math.sin(t*.8+tr.ph)*.03;tr.g.rotation.x=Math.cos(t*.6+tr.ph)*.02});
  const ff=.5+.5*Math.sin(t*.5);
  fanHolders.forEach(h=>h.rotation.z=h.userData.i*.17*(.15+.85*ff));
  workers.forEach(wk=>{wk.g.rotation.z=Math.sin(t*1.5+wk.ph)*.012;wk.g.position.y=.9+Math.sin(t*1.5+wk.ph)*.004});
  if(clockM){clockM.rotation.z=-t*Math.PI*2/30;clockH.rotation.z=-t*Math.PI*2/360}
  ripples.forEach(rp=>{
    const s=.7+.5*(.5+.5*Math.sin(t*1.6+rp.userData.ph));
    rp.scale.setScalar(s);rp.material.opacity=.55*(1-(s-.7)/.5*.7);
  });
  if(sigR){const b=Math.sin(t*2.5)>0;sigR.color.setHex(b?0xff6a55:0x8a4440);sigG.color.setHex(b?0x5f8a68:0x8adf9a)}
  clouds.forEach(g=>{g.position.x+=g.userData.sp*dt;if(g.position.x>11)g.position.x=-11});
  if(catG){
    const sk=t%18;let sz=1,sy=1;
    if(sk<1.2){const k=Math.sin(sk/1.2*Math.PI);sz=1+.35*k;sy=1-.25*k}
    catG.scale.set(1,sy*(1+.04*Math.sin(t*1.5)),sz);
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.t+=dt;
    b.obj.getWorldPosition(tmpV);
    b.sp.position.set(tmpV.x,tmpV.y+1.05+Math.sin(b.t*3)*.03,tmpV.z);
    if(b.t>2.6){scene.remove(b.sp);b.sp.material.map&&b.sp.material.map.dispose();b.sp.material.dispose();bubbles.splice(i,1)}
  }
  const tgt=follow?tmpV.set(trainGroup.position.x,2,trainGroup.position.z):camHome;
  camTarget.lerp(tgt,Math.min(1,dt*3));
  camera.position.set(
    camTarget.x+camD*Math.sin(camP)*Math.sin(camT),
    camTarget.y+camD*Math.cos(camP),
    camTarget.z+camD*Math.sin(camP)*Math.cos(camT));
  camera.lookAt(camTarget);
  $('pct').textContent=Math.round(2900/camD)+'%';
  renderer.render(scene,camera);
}
animate();
var ld=document.getElementById('loader');if(ld)ld.style.display='none';
window.__started=true;
}catch(err){
  showErr('❌ 场景启动失败：'+err.message+'\n（请截图发给开发者）');
  var ld2=document.getElementById('loader');if(ld2)ld2.style.display='none';
}
}
